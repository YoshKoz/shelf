[package]
name = "shelf"
version = "0.1.0"
edition = "2021"
description = "Local-first TUI bookmark/note manager. Markdown files + SQLite index, zero cloud."

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
fuzzy-matcher = "0.3"
directories = "5"
anyhow = "1"
open = "5"
